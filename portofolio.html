<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Portofolio Penyuluhan | Penyuluh Anti Korupsi</title>
<meta name="theme-color" content="#09090b">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b; --card: rgba(255,255,255,.035); --bd: rgba(255,255,255,.09);
    --red: #ef4444; --glow: rgba(239,68,68,.4); --gold: #f59e0b; --tx: #fafafa; --mu: #a1a1aa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { font-family: 'Outfit', system-ui, sans-serif; background: var(--bg); color: var(--tx); min-height: 100vh; overflow-x: hidden; line-height: 1.5; }
  
  /* Background Efek */
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(255,255,255,.022) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.022) 1px, transparent 1px); background-size: 60px 60px; pointer-events: none; mask-image: linear-gradient(#000, transparent 80%); -webkit-mask-image: linear-gradient(#000, transparent 80%); }
  body::after { content: ''; position: fixed; width: 720px; height: 720px; top: -320px; right: -220px; background: radial-gradient(circle, var(--glow), transparent 70%); filter: blur(100px); opacity: .5; pointer-events: none; }
  
  .wrap { position: relative; z-index: 1; width: min(1200px, 100% - 40px); margin: 0 auto; padding-bottom: 80px; }
  
  /* Header & Back Button */
  .top { padding: max(20px, env(safe-area-inset-top)) 0 0; }
  .back { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,.05); border: 1px solid var(--bd); color: var(--tx); padding: 11px 20px; border-radius: 100px; text-decoration: none; font-weight: 600; font-size: .9rem; backdrop-filter: blur(10px); transition: .3s; }
  .back:hover { background: var(--red); border-color: var(--red); transform: translateX(-3px); }
  
  /* Hero Section */
  .hero { text-align: center; padding: 50px 0 40px; }
  .badge { display: inline-block; padding: 8px 20px; border-radius: 100px; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: var(--red); font-weight: 600; font-size: 12px; letter-spacing: 3px; margin-bottom: 22px; text-transform: uppercase; }
  .hero h1 { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; line-height: 1.1; letter-spacing: -2px; margin-bottom: 18px; }
  .hero h1 .hl { background: linear-gradient(135deg, var(--red), var(--gold)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .hero p { color: var(--mu); font-size: 1.1rem; max-width: 620px; margin: 0 auto; }

  /* Filter Tabs */
  .tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 40px; flex-wrap: wrap; }
  .tab { padding: 10px 24px; border-radius: 100px; background: rgba(255,255,255,.03); border: 1px solid var(--bd); color: var(--mu); font-family: inherit; font-weight: 600; font-size: .9rem; cursor: pointer; transition: .3s; }
  .tab:hover { background: rgba(255,255,255,.08); color: var(--tx); }
  .tab.active { background: var(--red); border-color: var(--red); color: white; box-shadow: 0 6px 20px var(--glow); }

  /* Grid Portofolio */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 24px; }
  
  /* Kartu Media */
  .media-card { position: relative; background: var(--card); border: 1px solid var(--bd); border-radius: 20px; overflow: hidden; transition: transform .3s, box-shadow .3s; cursor: pointer; aspect-ratio: 16/9; }
  .media-card:hover { transform: translateY(-6px); box-shadow: 0 20px 40px rgba(0,0,0,.5); border-color: rgba(255,255,255,.2); }
  
  .media-thumb { width: 100%; height: 100%; object-fit: cover; display: block; background: #1a1a1a; transition: transform .3s; }
  .media-card:hover .media-thumb { transform: scale(1.05); }
  
  /* Tombol Play Video */
  .play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; background: rgba(239,68,68,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); transition: .3s; pointer-events: none; z-index: 3; }
  .media-card:hover .play-btn { transform: translate(-50%, -50%) scale(1.1); background: rgba(239,68,68,1); }

  /* Label Tipe Media */
  .badge-type { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,.6); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: 100px; font-size: 11px; font-weight: 700; letter-spacing: 1px; border: 1px solid rgba(255,255,255,.15); z-index: 3; }

  /* Iframe yang muncul setelah video diklik */
  .video-iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; z-index: 10; }

  /* === BAGIAN BARU: Info Overlay (Judul, Tempat, Waktu) === */
  .media-info {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 40px 16px 14px;
    background: linear-gradient(to top, rgba(0,0,0,.95) 0%, rgba(0,0,0,.7) 60%, transparent 100%);
    z-index: 2;
    pointer-events: none; /* Agar klik tetap tembus ke kartu */
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .media-info h3 {
    font-size: .95rem;
    font-weight: 700;
    color: #fff;
    line-height: 1.3;
    margin: 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .media-info .meta-row {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: .78rem;
    color: #d4d4d8;
    font-weight: 500;
  }
  .media-info .meta-row .icon {
    font-size: .85rem;
    opacity: .8;
  }

  /* Lightbox / Modal untuk Foto */
  .modal { display: none; position: fixed; z-index: 9999; inset: 0; background: rgba(0,0,0,.95); backdrop-filter: blur(10px); align-items: center; justify-content: center; padding: 20px; opacity: 0; transition: opacity .3s; }
  .modal.show { display: flex; opacity: 1; }
  .modal-content-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; max-width: 100%; max-height: 90vh; }
  .modal-img { max-width: 100%; max-height: 80vh; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); object-fit: contain; }
  /* Keterangan di dalam modal */
  .modal-caption { margin-top: 16px; text-align: center; color: #fff; max-width: 600px; }
  .modal-caption h4 { font-size: 1.1rem; margin-bottom: 6px; }
  .modal-caption p { font-size: .9rem; color: var(--mu); display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .modal-close { position: absolute; top: -40px; right: 0; color: white; font-size: 32px; font-weight: bold; cursor: pointer; transition: .2s; line-height: 1; }
  .modal-close:hover { color: var(--red); }

  /* Animasi Fade In */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive Modal Close */
  @media (max-width: 600px) {
    .modal-close { top: -45px; right: 0; font-size: 36px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="top">
    <a href="https://penyuluhantikorupsi.vercel.app/" class="back">← Kembali ke Beranda</a>
  </div>

  <header class="hero">
    <div class="badge">📸 Galeri Kegiatan</div>
    <h1>Portofolio <span class="hl">Penyuluhan</span></h1>
    <p>Dokumentasi foto dan video kegiatan penyuluhan anti korupsi di lapangan.</p>
  </header>

  <!-- Filter Tabs -->
  <div class="tabs">
    <button class="tab active" data-filter="all">Semua Media</button>
    <button class="tab" data-filter="video">Video YouTube</button>
    <button class="tab" data-filter="foto">Foto Kegiatan</button>
  </div>

  <!-- Grid Portofolio -->
  <div class="grid" id="galleryGrid"></div>
</div>

<!-- Modal Lightbox Foto -->
<div class="modal" id="imageModal">
  <div class="modal-content-wrapper">
    <span class="modal-close" id="closeModal">&times;</span>
    <img class="modal-img" id="modalImg" src="" alt="Zoom Foto">
    <div class="modal-caption">
      <h4 id="modalTitle"></h4>
      <p id="modalMeta"></p>
    </div>
  </div>
</div>

<script>
  // =====================================================================
  // CARA MENAMBAH MEDIA BARU:
  // Cukup tambahkan baris baru di dalam array di bawah ini.
  // Setiap item WAJIB memiliki: url, judul, tempat, dan waktu.
  // =====================================================================
  
  const daftarMedia = [
    // --- DAFTAR VIDEO YOUTUBE ---
    {
      url: "https://youtu.be/n8G2jQaxYWc",
      judul: "Podcast Aksi Nyata Tulungagung Istimewa",
      tempat: "Studio RGR FM Tulungagung",
      waktu: "26 Agustus 2026"
    },
    {
      url: "https://youtu.be/BxEt_06BZL4",
      judul: "Podcast Aksi Nyata Tulungagung Istimewa",
      tempat: "Studio RGR FM Tulungagung",
      waktu: "7 Oktober 2026"
    },
    {
      url: "https://www.youtube.com/watch?v=O-jTcGgOoYw",
      judul: "Podcast Aksi Nyata Tulungagung Istimewa",
      tempat: "Studio RGR FM Tulungagung",
      waktu: "21 Oktober 2026"
    },
    {
      url: "https://youtu.be/JJ9V0coJZts",
      judul: "Podcast Aksi Nyata Tulungagung Istimewa",
      tempat: "Pendopo Kabupaten Tulungagung",
      waktu: "28 Oktober 2026"
    },
    
    // --- DAFTAR FOTO KEGIATAN ---
    {
      url: "https://i.postimg.cc/28mZLBTK/IMG-20261105-143737.jpg?q=80&w=800&auto=format&fit=crop",
      judul: "Penyuluhan Anti Korupsi pada Diklat Teknis Perencana",
      tempat: "Liur Cafe dan Resto Tulungagung",
      waktu: "5 November 2026"
    },
    {
      url: "https://i.postimg.cc/JzF1R1th/IMG-20261001-WA0014.jpg?q=80&w=800&auto=format&fit=crop",
      judul: "Sosialisasi Nilai Integritas kepada Peserta Magang dan ASN",
      tempat: "Bagian Administrasi Pembangunan Setda",
      waktu: "1 Oktober 2026"
    },
    {
      url: "https://i.postimg.cc/gJVdy8sk/IMG-20260816-WA0015.jpg?q=80&w=800&auto=format&fit=crop",
      judul: "Penyuluhan Anti Korupsi & Bahaya Politik Uang",
      tempat: "Dusun Grogol Desa Bungur Karangrejo Tulungagung",
      waktu: "16 Agustus 2026"
    },
    {
      url: "https://i.postimg.cc/PrrhZLwp/Whats-App-Image-2026-08-26-at-09-02-32-(1).jpg?q=80&w=800&auto=format&fit=crop",
      judul: "Podcast Aksi Nyata Tulungagung Istimewa",
      tempat: "Studio RGR FM Tulungagung",
      waktu: "26 Agustus 2026"
    }
  ];

  // =====================================================================
  // LOGIKA SISTEM (Tidak perlu diubah)
  // =====================================================================

  const grid = document.getElementById('galleryGrid');
  const modal = document.getElementById('imageModal');
  const modalImg = document.getElementById('modalImg');
  const modalTitle = document.getElementById('modalTitle');
  const modalMeta = document.getElementById('modalMeta');
  const closeModal = document.getElementById('closeModal');
  
  // Fungsi untuk mendeteksi dan mengambil ID Video YouTube
  function getYouTubeID(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  // Render Media ke HTML
  function renderGallery() {
    grid.innerHTML = ''; // Kosongkan grid
    
    daftarMedia.forEach((item, index) => {
      const ytID = getYouTubeID(item.url);
      const isVideo = ytID !== null;
      
      const card = document.createElement('div');
      card.className = 'media-card';
      card.dataset.type = isVideo ? 'video' : 'foto';
      card.style.animation = `fadeInUp 0.4s ease forwards`;
      card.style.animationDelay = `${index * 0.05}s`;
      
      // Membangun HTML Info Overlay (Judul, Tempat, Waktu)
      const infoHTML = `
        <div class="media-info">
          <h3>${item.judul}</h3>
          <div class="meta-row">
            <span class="icon">📍</span>
            <span>${item.tempat}</span>
          </div>
          <div class="meta-row">
            <span class="icon">📅</span>
            <span>${item.waktu}</span>
          </div>
        </div>
      `;
      
      if (isVideo) {
        // JIKA MEDIA ADALAH VIDEO YOUTUBE
        const thumbnailUrl = `https://img.youtube.com/vi/${ytID}/maxresdefault.jpg`;
        
        card.innerHTML = `
          <div class="badge-type" style="color: #ef4444;">▶ VIDEO</div>
          <img src="${thumbnailUrl}" class="media-thumb" alt="Thumbnail Video" loading="lazy" onerror="this.onerror=null; this.src='https://img.youtube.com/vi/${ytID}/hqdefault.jpg';">
          <div class="play-btn">▶</div>
          ${infoHTML}
        `;
        
        // Saat diklik, ganti thumbnail dengan Iframe Video (Auto-play di halaman)
        card.addEventListener('click', () => {
          card.innerHTML = `
            <iframe class="video-iframe" src="https://www.youtube.com/embed/${ytID}?autoplay=1&rel=0&modestbranding=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
          `;
        });
        
      } else {
        // JIKA MEDIA ADALAH FOTO
        card.innerHTML = `
          <div class="badge-type" style="color: #3b82f6;">📷 FOTO</div>
          <img src="${item.url}" class="media-thumb" alt="Foto Kegiatan" loading="lazy">
          ${infoHTML}
        `;
        
        // Saat diklik, buka Lightbox (Zoom foto)
        card.addEventListener('click', () => {
          modalImg.src = item.url;
          modalTitle.textContent = item.judul;
          modalMeta.innerHTML = `<span>📍 ${item.tempat}</span> &nbsp;·&nbsp; <span>📅 ${item.waktu}</span>`;
          modal.classList.add('show');
        });
      }
      
      grid.appendChild(card);
    });
  }

  // Fungsi Filter Kategori
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', (e) => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      e.target.classList.add('active');
      
      const filter = e.target.dataset.filter;
      const cards = document.querySelectorAll('.media-card');
      
      cards.forEach(card => {
        if (filter === 'all' || card.dataset.type === filter) {
          card.style.display = 'block';
          card.style.animation = 'none';
          card.offsetHeight; // trigger reflow
          card.style.animation = 'fadeInUp 0.4s ease forwards';
        } else {
          card.style.display = 'none';
        }
      });
    });
  });

  // Tutup Modal Foto
  closeModal.addEventListener('click', () => {
    modal.classList.remove('show');
    modalImg.src = '';
  });
  
  // Tutup Modal jika klik di luar gambar
  modal.addEventListener('click', (e) => {
    if (e.target === modal) {
      modal.classList.remove('show');
      modalImg.src = '';
    }
  });

  // Jalankan Render saat halaman dimuat
  renderGallery();
</script>

</body>
</html>
