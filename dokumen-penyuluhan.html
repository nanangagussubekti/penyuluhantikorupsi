<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Dokumen Penyuluhan - Sekretaris Daerah</title>
<meta name="theme-color" content="#0c2340">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0c2340;--navy2:#16406b;--gold:#f2b705;--blue:#4aa3ff;--green:#34d399;--red:#ff6b6b;--purple:#a78bfa;--tx:#f4f7fb;--mu:#a9b8cc;--bd:rgba(255,255,255,.12);--card:rgba(255,255,255,.06);
--head:'Fraunces',Georgia,serif;--body:'Plus Jakarta Sans','Segoe UI',Tahoma,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--body);color:var(--tx);min-height:100vh;line-height:1.6;overflow-x:hidden;
 background:radial-gradient(900px 500px at 85% -10%,rgba(74,163,255,.28),transparent 60%),radial-gradient(700px 420px at -10% 110%,rgba(242,183,5,.12),transparent 60%),linear-gradient(160deg,#081a31,var(--navy) 55%,#11375f);background-attachment:fixed}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(#000,transparent 75%);-webkit-mask-image:linear-gradient(#000,transparent 75%)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px;border-radius:10px}
.wrap{position:relative;z-index:1;width:min(1180px,100% - 40px);margin:0 auto;padding:max(28px,env(safe-area-inset-top)) 0 60px}
.hero{text-align:center;padding:36px 0 28px}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:99px;background:rgba(242,183,5,.12);border:1px solid rgba(242,183,5,.4);color:var(--gold);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;margin-bottom:20px}
.hero h1{font-family:var(--head);font-weight:800;font-size:clamp(2.2rem,6vw,3.8rem);line-height:1.08;letter-spacing:-.02em;margin-bottom:14px}
.hero h1 span{background:linear-gradient(120deg,var(--gold),#ffd966);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{color:var(--mu);font-size:1.08rem;max-width:560px;margin:0 auto}
.stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:26px}
.stat{padding:12px 22px;border:1px solid var(--bd);background:var(--card);border-radius:16px;text-align:left;min-width:120px}
.stat b{display:block;font-family:var(--head);font-size:1.9rem;line-height:1.1}
.stat span{font-size:.8rem;color:var(--mu)}
.bar{position:sticky;top:0;z-index:20;padding:12px 0;margin-bottom:18px;background:linear-gradient(#0a1d36 65%,transparent)}
.search{position:relative}
.search svg{position:absolute;left:18px;top:16px;width:20px;height:20px;stroke:var(--mu);fill:none;stroke-width:2}
.search input{width:100%;height:52px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.07);color:var(--tx);font:inherit;font-size:1rem;padding:0 70px 0 50px;transition:.25s}
.search input::placeholder{color:#7f92aa}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(242,183,5,.18)}
.search kbd{position:absolute;right:14px;top:14px;font:700 .75rem var(--body);color:var(--mu);border:1px solid var(--bd);border-radius:6px;padding:2px 9px}
.chips{display:flex;gap:10px;margin-top:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--mu);font:inherit;font-weight:700;font-size:.86rem;cursor:pointer;transition:.2s}
.chip:hover{color:var(--tx);background:rgba(255,255,255,.1)}
.chip em{font-style:normal;font-size:.74rem;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:99px}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1400;box-shadow:0 8px 22px rgba(242,183,5,.3)}
.chip.on em{background:rgba(0,0,0,.18)}
.meta{color:var(--mu);font-size:.88rem;margin:0 2px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));gap:20px}
.card{--c:var(--blue);position:relative;display:flex;flex-direction:column;background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--c);border-radius:6px 22px 22px 22px;padding:24px;cursor:pointer;backdrop-filter:blur(8px);transition:transform .3s cubic-bezier(.16,1,.3,1),box-shadow .3s,border-color .3s;animation:up .5s cubic-bezier(.16,1,.3,1) both;animation-delay:calc(var(--i)*70ms)}
.card.t-e{--c:var(--green)}.card.t-n{--c:var(--gold)}.card.t-s{--c:var(--red)}.card.t-r{--c:var(--purple)}
.card::before{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:.3s;background:radial-gradient(360px circle at var(--mx,50%) var(--my,0),rgba(255,255,255,.1),transparent 45%)}
.card:hover{transform:translateY(-6px);box-shadow:0 24px 50px rgba(0,0,0,.45);border-color:rgba(255,255,255,.28);border-top-color:var(--c)}
.card:hover::before{opacity:1}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.ico svg{width:28px;height:28px;stroke:var(--c);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.no{font-family:var(--head);font-weight:800;font-size:2.4rem;line-height:1;color:rgba(255,255,255,.1)}
.tipe{display:inline-block;align-self:flex-start;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-bottom:6px}
.card h3{font-family:var(--head);font-size:1.28rem;line-height:1.3;margin-bottom:8px}
.card p{color:var(--mu);font-size:.92rem;flex:1;margin-bottom:18px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid var(--bd);flex-wrap:wrap}
.date{display:inline-flex;align-items:center;gap:6px;font-size:.82rem;color:var(--mu)}
.date svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.acts{display:flex;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 16px;border-radius:99px;border:1px solid transparent;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer;text-decoration:none;transition:.2s}
.btn.p{background:var(--gold);color:#1a1400}.btn.p:hover{background:#ffc820}
.btn.s{background:transparent;border-color:var(--bd);color:var(--tx)}.btn.s:hover{background:rgba(255,255,255,.1)}
.empty{text-align:center;padding:60px 20px;border:1px dashed var(--bd);border-radius:24px;color:var(--mu)}
.empty b{display:block;font-size:1.25rem;color:var(--tx);margin-bottom:6px}
/* MODAL */
.modal{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:rgba(4,12,24,.94);backdrop-filter:blur(6px);padding:max(14px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.modal.on{display:flex;animation:fade .25s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.mh h2{font-family:var(--head);font-size:1.15rem;flex:1;min-width:200px;line-height:1.3}
.mh .cnt{font-size:.82rem;color:var(--mu);font-weight:700}
.nb{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:1.1rem;cursor:pointer}
.nb:hover:not(:disabled){background:rgba(255,255,255,.14)}.nb:disabled{opacity:.3;cursor:default}
.btn.g{background:var(--green);color:#052e1f}.btn.x{background:var(--red);color:#fff}
.mb{position:relative;flex:1;border-radius:14px;overflow:hidden;background:#fff}
.mb iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.load{position:absolute;inset:0;display:grid;place-items:center;background:#0f2a4a;color:var(--mu);gap:10px;text-align:center;transition:opacity .3s}
.load.off{opacity:0;pointer-events:none}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--gold);animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.hint{font-size:.8rem;color:var(--mu);text-align:center;margin-top:10px}
.hint a{color:var(--gold);font-weight:700}
@media (max-width:640px){.hero{padding-top:20px}.stat{flex:1 1 28%;min-width:0;padding:12px 14px}.search kbd{display:none}.search input{padding-right:16px}.mh h2{font-size:1rem}.btn.g span{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="badge">Arsip Penyuluhan</div>
    <h1>Dokumen <span>Penyuluhan</span></h1>
    <p>Proposal, Disposisi, Daftar Hadir, Surat &amp; Undangan</p>
    <div class="stats" id="stats"></div>
  </header>
  <div class="bar">
    <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Cari dokumen…" autocomplete="off" aria-label="Cari dokumen"><kbd aria-hidden="true">/</kbd></label>
    <div class="chips" id="chips" role="tablist" aria-label="Jenis dokumen"></div>
  </div>
  <p class="meta" id="cnt"></p>
  <main class="grid" id="grid"></main>
  <div class="empty" id="empty" hidden><b>Dokumen tidak ditemukan</b>Coba kata kunci lain</div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
  <div class="mh">
    <button class="nb" id="prev" aria-label="Dokumen sebelumnya">&#8592;</button>
    <button class="nb" id="next" aria-label="Dokumen berikutnya">&#8594;</button>
    <h2 id="mt">Judul Dokumen</h2><span class="cnt" id="mc"></span>
    <a class="btn g" id="open" href="#" target="_blank" rel="noopener">&#8599; <span>Buka di Tab Baru</span></a>
    <button class="btn x" id="close">&#10005; Tutup</button>
  </div>
  <div class="mb"><iframe id="frame" title="Pratinjau dokumen" src=""></iframe>
    <div class="load" id="load"><div><div class="spin"></div>Memuat dokumen…</div></div></div>
  <p class="hint">Pratinjau tidak tampil? <a id="alt" href="#" target="_blank" rel="noopener">Buka langsung di Google Drive</a></p>
</div>

<script>
const D=[
{"id": "1igbzCH7k04i2OJoKnXCqiyNQ1z0gPJPR", "judul": "Proposal ke Sekretaris Daerah", "deskripsi": "Dokumen proposal yang ditujukan kepada Sekretaris Daerah", "tanggal": "05 November 2026", "tipe": "proposal"},
{"id": "1dpfv2Bt-RRMk6ysd5ziFAV-oQsMxxMXs", "judul": "Disposisi Sekretaris Daerah", "deskripsi": "Lembar disposisi dari Sekretaris Daerah", "tanggal": "05 November 2026", "tipe": "disposisi"},
{"id": "1HLMha7WiPXlRqlLcG_3BFWk9UhBN9pfy", "judul": "Undangan Penyuluhan Peserta PKL & Magang Gelombang 1", "deskripsi": "Undangan penyuluhan bagi peserta PKL dan Magang di lingkup Sekretariat Daerah - Gelombang 1", "tanggal": "12 November 2026", "tipe": "undangan"},
{"id": "1YQPlQGHuW8oFtDaOBsF6pPFmqK5YakYF", "judul": "Surat Mohon Bantuan Snack Penyuluhan Gelombang 1", "deskripsi": "Surat permohonan bantuan snack untuk kegiatan penyuluhan Gelombang 1", "tanggal": "12 November 2026", "tipe": "surat"},
{"id": "1jsLgCsB7fX3jBaA51m-g3zPTcaSAcscj", "judul": "Proposal ke Rektor Universitas Tulungagung", "deskripsi": "Dokumen proposal yang ditujukan kepada Rektor Universitas Tulungagung", "tanggal": "10 November 2026", "tipe": "proposal"},
{"id": "1kN4uwf-lE3oc3l7ACDrTfgliNvYlX-0t", "judul": "Surat Permohonan Narasumber dari Bapenda Tulungagung", "deskripsi": "Surat permohonan narasumber dari Badan Pendapatan Daerah (Bapenda) Tulungagung", "tanggal": "11 November 2026", "tipe": "surat"}
];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={
 proposal:'<svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>',
 disposisi:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12.5 2.6 2.6L16 9.5"/></svg>',
 undangan:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
 surat:'<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M4 9h16M9 4v16"/></svg>'};
const T={proposal:{l:'Proposal',c:''},disposisi:{l:'Disposisi',c:'t-e'},undangan:{l:'Undangan',c:'t-n'},surat:{l:'Surat',c:'t-s'}};
const CAL='<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></svg>';
D.forEach((d,n)=>d.n=n);
let st={q:'',f:'all'},vis=[],cur=-1,opener=null;
const pv=d=>'https://drive.google.com/file/d/'+d.id+'/preview', vw=d=>'https://drive.google.com/file/d/'+d.id+'/view';

function stats(){const c={};D.forEach(d=>c[d.tipe]=(c[d.tipe]||0)+1);
 $('stats').innerHTML='<div class="stat"><b>'+D.length+'</b><span>Dokumen</span></div>'+Object.keys(T).filter(k=>c[k]).map(k=>'<div class="stat"><b>'+c[k]+'</b><span>'+T[k].l+'</span></div>').join('')}
function chips(){const c={all:D.length};D.forEach(d=>c[d.tipe]=(c[d.tipe]||0)+1);
 $('chips').innerHTML=['all'].concat(Object.keys(T).filter(k=>c[k])).map(k=>'<button class="chip'+(st.f===k?' on':'')+'" role="tab" aria-selected="'+(st.f===k)+'" data-f="'+k+'">'+(k==='all'?'Semua':T[k].l)+'<em>'+c[k]+'</em></button>').join('')}
function render(){
 const q=st.q.trim().toLowerCase();
 vis=D.filter(d=>(st.f==='all'||d.tipe===st.f)&&(!q||(d.judul+' '+d.deskripsi+' '+d.tanggal).toLowerCase().includes(q)));
 $('grid').innerHTML=vis.map((d,i)=>{const t=T[d.tipe]||T.proposal;
  return '<article class="card '+t.c+'" style="--i:'+i+'" data-i="'+i+'" tabindex="0" role="button" aria-label="Buka '+esc(d.judul)+'"><div class="top"><div class="ico">'+(IC[d.tipe]||IC.proposal)+'</div><span class="no">'+String(d.n+1).padStart(2,'0')+'</span></div>'+
   '<span class="tipe">'+t.l+'</span><h3>'+esc(d.judul)+'</h3><p>'+esc(d.deskripsi)+'</p>'+
   '<div class="foot"><span class="date">'+CAL+esc(d.tanggal)+'</span><div class="acts"><a class="btn s" href="'+vw(d)+'" target="_blank" rel="noopener">Drive &#8599;</a><button class="btn p" data-open>Lihat PDF</button></div></div></article>'}).join('');
 $('cnt').textContent=vis.length+' dokumen ditampilkan';$('empty').hidden=vis.length>0;$('grid').hidden=!vis.length;chips()}

function show(i){cur=i;const d=vis[i];
 $('load').classList.remove('off');$('frame').src=pv(d);
 $('mt').textContent=d.judul;$('mc').textContent=(i+1)+' / '+vis.length;
 $('open').href=vw(d);$('alt').href=vw(d);
 $('prev').disabled=i===0;$('next').disabled=i===vis.length-1;
 try{history.replaceState(null,'','#dok-'+(d.n+1))}catch(e){}}
function openM(i,el){opener=el||null;$('modal').classList.add('on');document.body.style.overflow='hidden';show(i);$('close').focus()}
function closeM(){$('modal').classList.remove('on');$('frame').src='';document.body.style.overflow='';cur=-1;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}if(opener)opener.focus()}
$('frame').addEventListener('load',()=>{if(cur>=0)$('load').classList.add('off')});

$('chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){st.f=b.dataset.f;render()}});
$('q').addEventListener('input',e=>{st.q=e.target.value;render()});
$('grid').addEventListener('click',e=>{if(e.target.closest('a'))return;const c=e.target.closest('.card');if(c)openM(+c.dataset.i,c)});
$('grid').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();openM(+e.target.dataset.i,e.target)}});
$('grid').addEventListener('pointermove',e=>{const c=e.target.closest('.card');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')});
$('prev').onclick=()=>cur>0&&show(cur-1);$('next').onclick=()=>cur<vis.length-1&&show(cur+1);
$('close').onclick=closeM;
$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeM()});
addEventListener('keydown',e=>{
 if($('modal').classList.contains('on')){if(e.key==='Escape')closeM();else if(e.key==='ArrowLeft'&&cur>0)show(cur-1);else if(e.key==='ArrowRight'&&cur<vis.length-1)show(cur+1);return}
 if(e.key==='/'&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$('q').focus()}
 else if(e.key==='Escape'&&document.activeElement===$('q')){$('q').value='';st.q='';render();$('q').blur()}});

stats();render();
const h=location.hash.match(/^#dok-(\d+)$/);if(h){const k=vis.findIndex(d=>d.n===+h[1]-1);if(k>=0)openM(k)}
</script>
</body>
</html>
